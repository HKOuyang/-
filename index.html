<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<title>形容詞クイズ（GitHub Pages版）</title>
<link rel="stylesheet" href="style.css">
<div class="card">
  <h1>形容詞クイズ（N5–N1 / カタカナ拡張・モバイル対応）</h1>
  <div class="toolbar">
    <button id="start">開始 ▶</button>
    <label><input type="checkbox" id="onlyKata"> カタカナ形容詞だけ</label>
  </div>
  <div id="counter" class="meta"></div>
  <div class="kana" id="kana">（開始を押してください）</div>
  <div class="btns">
    <button id="showKanji" disabled>漢字を表示</button>
    <button id="showRomaji" disabled>ローマ字を表示</button>
    <button id="showBorrow" disabled>借用語を表示</button>
    <button id="next" disabled>次へ ▶</button>
  </div>
  <div class="reveal"><strong>漢字：</strong><span id="kanji">（非表示）</span></div>
  <div class="reveal"><strong>ローマ字：</strong><span id="romaji">（非表示）</span></div>
  <div class="reveal"><strong>借用：</strong><span id="borrow">（非表示）</span></div>
  <div class="reveal"><strong>中文：</strong><span id="cn">（非表示）</span></div>
  <div class="meta" id="pos"></div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</html>
