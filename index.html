<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<title>形容詞小測驗 · 漂亮版</title>
<link rel="stylesheet" href="style.css">
<div class="header">
  <div class="logo"></div>
  <div class="title">
    <h1>形容詞小測驗 <span class="badge">新版</span></h1>
    <p>N5–N1，含 80 個常用カタカナ形容詞。支援「加入主畫面」與離線。</p>
  </div>
</div>
<div class="card">
  <div class="toolbar">
    <button id="forceUpdate" class="btn">🔄 強制更新</button>
    <button id="start" class="btn primary">開始 ▶</button>
    <label><input type="checkbox" id="onlyKata"> 只抽 <b>カタカナ形容詞</b></label>
    <div id="counter" class="meta"></div>
  </div>
  <div class="kana" id="kana">（請先按「開始」）</div>
  <div class="row">
    <button id="showKanji" class="btn" disabled>顯示漢字</button>
    <button id="showRomaji" class="btn" disabled>顯示羅馬字</button>
    <button id="showBorrow" class="btn" disabled>顯示借用語</button>
    <button id="next" class="btn" disabled>下一題 ▶</button>
  </div>
  <div class="reveal"><strong>漢字：</strong><span id="kanji">（未顯示）</span></div>
  <div class="reveal"><strong>羅馬字：</strong><span id="romaji">（未顯示）</span></div>
  <div class="reveal"><strong>借用：</strong><span id="borrow">（未顯示）</span></div>
  <div class="reveal"><strong>中文（繁體）：</strong><span id="cn">（未顯示）</span></div>
</div>
<div class="footer">Made for you · 可以加入主畫面離線使用</div>
<script src="data.js"></script>
<script src="app.js"></script>
</html>
